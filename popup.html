<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:240px;font:13px system-ui;background:#141018;color:#eee;padding:14px}
h1{font-size:15px;margin:0 0 10px;color:#ff7a1a}.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.host{color:#6be03a;word-break:break-all;font-size:12px}
.sw{position:relative;width:42px;height:22px}.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#444;border-radius:22px;cursor:pointer;transition:.2s}
.sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:#ff7a1a}input:checked+.sl:before{transform:translateX(20px)}
</style></head><body><h1>🎃 Haunted Slime</h1>
<div class="host" id="host">…</div>
<div class="row"><span>Enabled on this site</span><label class="sw"><input type="checkbox" id="site"><span class="sl"></span></label></div>
<div class="row"><span>Enabled globally</span><label class="sw"><input type="checkbox" id="global"><span class="sl"></span></label></div>
<script src="popup.js"></script></body></html>
